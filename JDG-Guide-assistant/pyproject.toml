[project]
name = "jdg-guide-assistant"
version = "0.1.0"
description = "RAG assistant over the sobolevbel/jdg guide for setting up a sole proprietorship (JDG) in Poland"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minsearch>=0.1.1",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdg_assistant"]
